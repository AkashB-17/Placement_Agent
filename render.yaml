# Render Blueprint for the FastAPI backend (the web app deploys separately on Vercel).
# Render dashboard → New → Blueprint → pick this repo. Secrets marked `sync: false` are
# typed into the dashboard once and never stored in git.
services:
  - type: web
    name: placement-api
    runtime: python
    plan: free            # sleeps after 15 min idle; first request then takes ~1 min. "starter" never sleeps.
    region: singapore     # closest Render region to the Supabase database (Tokyo) and to India
    branch: main
    autoDeploy: true      # every push to main redeploys
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # Run the venv's uvicorn directly: `uv run` would re-sync and pull in the dev group.
    startCommand: .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DEV_AUTH_BYPASS
        value: "false"
      # Secrets: set in the dashboard (Environment tab).
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DATABASE_URL          # Supabase Session pooler URI (IPv4-friendly)
        sync: false
      - key: CORS_ORIGINS          # JSON list, e.g. ["https://placement-portal.vercel.app"]
        sync: false
