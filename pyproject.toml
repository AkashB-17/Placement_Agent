[project]
name = "placement-agent"
version = "0.1.0"
description = "Campus placement backend: deterministic eligibility and evidence-based JD matching"
readme = "README.md"
authors = [
    { name = "AkashB-17", email = "aakashbbiswas17@email.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "chromadb>=1.5.9",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.31.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.1",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
    "python-dotenv>=1.2.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
