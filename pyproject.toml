[project]
name = "project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AkashB-17", email = "aakashbbiswas17@email.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "chromadb>=1.5.9",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.31.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.1",
    "python-multipart>=0.0.32",
    "supabase>=2.32.0",
    "uvicorn[standard]>=0.54.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
project = "project:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
